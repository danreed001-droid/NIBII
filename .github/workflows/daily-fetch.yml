name: Daily Market Data Fetch

# Runs on GitHub's own infrastructure, which has normal outbound internet -
# unlike the Claude Code Remote sandbox the daily-cycle Routine runs in,
# which blocks Yahoo Finance at its network proxy. This workflow owns every
# step that needs live market data; the Routine (see README's "The daily
# cycle") picks up what this drafts and only does research/judgment, no
# raw network calls of its own.

on:
  schedule:
    # Two runs/day now that TICKERS is all-futures (see mtl/fetch.py) and
    # trades near 24h - a pre-open and a mid-afternoon read both see fresh
    # prices, unlike the old single EOD-adjacent run. GitHub Actions cron
    # has no timezone support, so each fixed UTC time drifts by an hour of
    # ET local time across DST - both were chosen to land close to the
    # target ET time in both states, never after it (never after 9:30am
    # for the pre-open run):
    # 13:15 UTC = 9:15am EDT / 8:15am EST - shortly before the 9:30am ET open.
    - cron: '15 13 * * 1-5'
    # 19:30 UTC = 3:30pm EDT / 2:30pm EST - mid-afternoon.
    - cron: '30 19 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: TEMP diagnostic - verify candidate futures tickers
        run: python scripts/verify_tickers.py ES=F NQ=F ZN=F DX=F RTY=F GC=F

      - name: Settle prior calls with now-available closes
        run: python scripts/settle.py

      - name: Determine session date and draft today's contracts if needed
        id: session
        run: |
          S=$(python -c "from mtl.calendar_nyse import most_recent_completed_session as f; print(f())")
          echo "s=$S" >> "$GITHUB_OUTPUT"
          if [ -f "documents/$S.json" ] || [ -f "contracts/inputs.$S.json" ]; then
            echo "$S already published or drafted - nothing to fetch"
          else
            python scripts/prepare_daily.py "$S"
          fi

      - name: Commit and push whatever changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Daily data fetch: settle + draft ${{ steps.session.outputs.s }}"
            git push
          fi
