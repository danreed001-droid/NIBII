name: Daily Market Data Fetch

# Runs on GitHub's own infrastructure, which has normal outbound internet -
# unlike the Claude Code Remote sandbox the daily-cycle Routine runs in,
# which blocks Yahoo Finance at its network proxy. This workflow owns every
# step that needs live market data; the Routine (see README's "The daily
# cycle") picks up what this drafts and only does research/judgment, no
# raw network calls of its own.

on:
  schedule:
    # Two runs/day now that TICKERS is all-futures (see mtl/fetch.py) and
    # trades near 24h - a pre-open and a mid-afternoon read both see fresh
    # prices, unlike the old single EOD-adjacent run. GitHub Actions cron
    # has no timezone support, so each fixed UTC time drifts by an hour of
    # ET local time across DST - both were chosen to land close to the
    # target ET time in both states, never after it (never after 9:30am
    # for the pre-open run):
    # 13:15 UTC = 9:15am EDT / 8:15am EST - shortly before the 9:30am ET open.
    - cron: '15 13 * * 1-5'
    # 19:30 UTC = 3:30pm EDT / 2:30pm EST - mid-afternoon.
    - cron: '30 19 * * 1-5'
    # Sunday live-price-only refresh (the steps below skip settle/draft when
    # github.event.schedule matches it). CME futures reopen at 6pm ET Sunday;
    # 23:30 UTC = 7:30pm EDT / 6:30pm EST, after the reopen in both states.
    - cron: '30 23 * * 0'
    # Report refreshes 10 minutes before each "Market Tape Ledger - report
    # refresh" Routine (9:30am, 10:45am, 1:15pm, 3:47pm ET), which pulls
    # what these render and republishes the Claude artifact. Each ET time is
    # listed at both its EDT and EST UTC time; the dst-gate job below only
    # lets the one matching the current New York offset through.
    # 9:20am ET
    - cron: '20 13 * * 1-5'   # EDT
    - cron: '20 14 * * 1-5'   # EST
    # 10:35am ET
    - cron: '35 14 * * 1-5'   # EDT
    - cron: '35 15 * * 1-5'   # EST
    # 1:05pm ET
    - cron: '5 17 * * 1-5'    # EDT
    - cron: '5 18 * * 1-5'    # EST
    # 3:37pm ET
    - cron: '37 19 * * 1-5'   # EDT
    - cron: '37 20 * * 1-5'   # EST
  # Follow-up run after a daily-cycle Routine publishes: the Routine pushes
  # its drafted votes/document to main, and this re-runs 10 minutes later
  # (see the wait step) to settle, refresh live prices and re-render the
  # page on top of it. Pushes made by this workflow's own GITHUB_TOKEN
  # never trigger push events, so this can't loop on itself.
  push:
    branches: [main]
    paths: ['documents/20*.json', 'contracts/**', 'data/news_log.json', 'data/patterns.json']
  workflow_dispatch: {}

permissions:
  contents: write

# A Routine pushes twice in a row (the board, then data/patterns.json), so a
# newer push cancels a still-waiting follow-up run - only the last one runs.
# Scheduled/manual runs each get their own group and are never cancelled.
concurrency:
  group: ${{ github.event_name == 'push' && 'after-routine' || github.run_id }}
  cancel-in-progress: true

jobs:
  dst-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          # Keyed off which cron fired (not the clock), so a late-starting
          # scheduled run still gates correctly.
          case "$SCHED" in
            '20 13 * * 1-5'|'35 14 * * 1-5'|'5 17 * * 1-5'|'37 19 * * 1-5') want=-0400 ;;
            '20 14 * * 1-5'|'35 15 * * 1-5'|'5 18 * * 1-5'|'37 20 * * 1-5') want=-0500 ;;
            *) want=any ;;
          esac
          now=$(TZ=America/New_York date +%z)
          if [ "$want" = any ] || [ "$want" = "$now" ]; then run=true; else run=false; fi
          echo "schedule='$SCHED' wants $want, New York is $now -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  fetch:
    needs: dst-gate
    if: needs.dst-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wait 10 minutes for the Routine to finish pushing
        if: github.event_name == 'push'
        run: sleep 600

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The push that triggered this run may no longer be the tip of main
          # after the wait - check out the latest main, not the triggering sha.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Settle prior calls with now-available closes
        if: github.event.schedule != '30 23 * * 0'
        run: python scripts/settle.py

      - name: Determine session date and draft today's contracts if needed
        id: session
        if: github.event.schedule != '30 23 * * 0'
        run: |
          S=$(python -c "from mtl.calendar_nyse import most_recent_completed_session as f; print(f())")
          echo "s=$S" >> "$GITHUB_OUTPUT"
          if [ -f "documents/$S.json" ] || [ -f "contracts/inputs.$S.json" ]; then
            echo "$S already published or drafted - nothing to fetch"
          else
            python scripts/prepare_daily.py "$S"
          fi

      - name: Fetch a live price snapshot for the ticker strip
        run: python scripts/fetch_live.py

      - name: Re-render the latest published report with fresh live prices
        run: |
          LATEST=$(python scripts/latest_document_date.py)
          if [ -n "$LATEST" ]; then
            python scripts/render_html.py "$LATEST"
          else
            echo "no published document yet - nothing to render"
          fi

      - name: Commit and push whatever changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            if [ "${{ github.event.schedule }}" = "30 23 * * 0" ]; then
              git commit -m "Sunday live price refresh"
            else
              git commit -m "Daily data fetch: settle + draft ${{ steps.session.outputs.s }}"
            fi
            # A Routine may have pushed to main while this ran; replay this
            # commit on top of it (this run's freshly rendered files win).
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 10
            done
            exit 1
          fi
