name: Daily Market Data Fetch

# Runs on GitHub's own infrastructure, which has normal outbound internet -
# unlike the Claude Code Remote sandbox the daily-cycle Routine runs in,
# which blocks Yahoo Finance at its network proxy. This workflow owns every
# step that needs live market data; the Routine (see README's "The daily
# cycle") picks up what this drafts and only does research/judgment, no
# raw network calls of its own.

on:
  schedule:
    # 11:15 UTC = 7:15am EDT / 6:15am EST, weekdays - safely before the
    # 9:30am ET open in both DST states. GitHub Actions cron has no
    # timezone support, so a single UTC time is used year-round.
    - cron: '15 11 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: TEMP diagnose unverified tickers
        run: |
          python3 - <<'PYEOF'
          import yfinance as yf

          def probe(label, ticker, interval="1d", period="5d"):
              try:
                  df = yf.Ticker(ticker).history(interval=interval, period=period, auto_adjust=False)
                  if df is None or df.empty:
                      print(f"{label} ({ticker}, {interval}): EMPTY")
                  else:
                      last = df.tail(1)
                      print(f"{label} ({ticker}, {interval}): OK rows={len(df)} last_close={float(last['Close'].iloc[0]):.4f} last_date={df.index[-1]}")
              except Exception as e:
                  print(f"{label} ({ticker}, {interval}): ERROR {e}")

          print("=== gold spot candidates ===")
          probe("gold XAUUSD=X", "XAUUSD=X")
          probe("gold XAU=X", "XAU=X")
          probe("gold GC=F (futures, for comparison)", "GC=F")

          print("=== yields ===")
          probe("10Y ^TNX", "^TNX")
          probe("5Y ^FVX", "^FVX")
          probe("30Y ^TYX", "^TYX")
          probe("13wk ^IRX", "^IRX")

          print("=== hourly intraday (for market structure) ===")
          probe("SPX hourly", "^GSPC", interval="60m", period="5d")
          probe("TLT hourly", "TLT", interval="60m", period="5d")

          print("=== FRED DGS2 ===")
          import urllib.request, csv, io
          try:
              url = "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS2"
              with urllib.request.urlopen(url, timeout=20) as resp:
                  text = resp.read().decode('utf-8')
              rows = list(csv.DictReader(io.StringIO(text)))
              last = [r for r in rows if list(r.values())[1] not in (None, '.', '')][-1]
              print(f"FRED DGS2: OK rows={len(rows)} last={last}")
          except Exception as e:
              print(f"FRED DGS2: ERROR {e}")
          PYEOF

      - name: Settle prior calls with now-available closes
        run: python scripts/settle.py

      - name: Determine session date and draft today's contracts if needed
        id: session
        run: |
          S=$(python -c "from mtl.calendar_nyse import most_recent_completed_session as f; print(f())")
          echo "s=$S" >> "$GITHUB_OUTPUT"
          if [ -f "documents/$S.json" ] || [ -f "contracts/inputs.$S.json" ]; then
            echo "$S already published or drafted - nothing to fetch"
          else
            python scripts/prepare_daily.py "$S"
          fi

      - name: Commit and push whatever changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Daily data fetch: settle + draft ${{ steps.session.outputs.s }}"
            git push
          fi
