name: Scanner watchdog

# Each weekday morning, before the open: is last night's Top 5 Strongest run in? Every run logs the default
# plan's decision to the paper record (data/paper_ledger.json), so a missing day means the run failed without
# reporting, was skipped or delayed by GitHub, or scheduled runs were paused. A missing run can't report itself,
# so this opens the issue (and adds the line to the page's issues list).

on:
  schedule:
    # 13:31 UTC Mon-Fri = 9:31am EDT / 8:31am EST
    - cron: '31 13 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Last night's run is in
        id: fresh
        run: python scripts/check_scanner_fresh.py watch
      - name: Open an issue if it isn't
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          bash scripts/report_failure.sh "Scanner run missing $(TZ=America/New_York date +%Y-%m-%d)" \
            "Last night's Top 5 Strongest run didn't log a decision (it failed, was skipped by GitHub, or ran on stale prices), so the dashboard and any trade alert may be out of date. Run it by hand from the Actions tab (Top 5 Strongest, Run workflow) before trading." run
