name: Top 5 Strongest

# Rebuilds docs/scanner.html - the "Top 5 Strongest" momentum dashboard linked
# from the Market Tape Ledger page - after each US session closes:
# scripts/momentum_scan.py ranks the S&P 500 + Nasdaq-100 on daily closes and
# replays the weekly rule since 2020, then scripts/render_scanner.py draws the
# page. Holdings only change at the Friday close; weekday runs refresh the
# rankings and the "if it rebalanced today" banner. The S&P 500 and
# Nasdaq-100 lists refresh themselves once they're a week old.

on:
  schedule:
    # 21:20 UTC Mon-Fri = 5:20pm EDT / 4:20pm EST, after the close and
    # Yahoo's end-of-day prices.
    - cron: '20 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: momentum-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Rank the S&P 500 + Nasdaq-100 and replay the rule
        run: python scripts/momentum_scan.py

      - name: Render the dashboard
        run: python scripts/render_scanner.py

      - name: Commit and push the dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scanner.html data/sp500.csv data/sp500.asof data/ndx100.csv data/ndx100.asof
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Top 5 Strongest dashboard refresh"
          # The daily-fetch workflow pushes to main too; replay on top.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
