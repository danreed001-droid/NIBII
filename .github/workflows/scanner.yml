name: Top 5 Strongest

# Rebuilds docs/scanner.html - the "Top 5 Strongest" momentum dashboard linked
# from the Market Tape Ledger page - after each US session closes:
# scripts/momentum_scan.py ranks the S&P 500 on daily closes and
# replays the weekly rule since 2020, then scripts/render_scanner.py draws the
# page; scripts/ignition_scan.py adds the "Next big thing watch" (every US
# stock checked for gap-ups on heavy volume). Holdings only change at the Friday close; weekday runs refresh the
# rankings and the "if it rebalanced today" banner. The S&P 500 and
# Nasdaq-100 lists refresh themselves once they're a week old.
# On Fridays, when Monday's trade has anything to do (stock swaps, a sleeve
# switch, an Auto / Guard / Steps mix change), it opens a "Trade Mon ..." issue
# that @mentions the repo owner so GitHub emails / pushes it
# (scripts/weekly_alert.py), and closes the previous week's alert. On other
# weekdays it alerts when Boost + rotation (the default plan) switches or the
# blow-off exit sells: those trade at the next session's close.

on:
  schedule:
    # 22:20 UTC Mon-Fri = 6:20pm EDT / 5:20pm EST, well after the close and
    # Yahoo's end-of-day prices in both summer and winter.
    - cron: '20 22 * * 1-5'
    # GitHub starts scheduled runs late when it's busy (3.5 hours on Oct 28, 2026), so three more tries follow,
    # each going ahead only when tonight's decision isn't logged yet: 22:50 and 23:35 UTC Mon-Fri, and 02:20 UTC
    # Tue-Sat (that evening in New York). An outside timer (cron-job.org) can also start the run on the dot through
    # workflow_dispatch (README, "Keeping it running"); the scheduled tries then find it done and stop.
    - cron: '50 22 * * 1-5'
    - cron: '35 23 * * 1-5'
    - cron: '20 2 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: momentum-dashboard
  cancel-in-progress: false

jobs:
  gate:
    # a scheduled run goes ahead only when tonight's decision isn't logged yet (a run by hand always goes ahead)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.need.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: need
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # if the check itself breaks, run anyway: a second run is harmless, a missed one isn't
            python scripts/check_scanner_fresh.py gate || echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      # The backups for a night Yahoo fails (mtl/backup_prices.py): last run's prices, kept in GitHub's Actions
      # cache (not the repo), and Tiingo's closing prices (the TIINGO_KEY secret; without it only the saved copy).
      - name: Restore the saved price copy
        uses: actions/cache/restore@v5
        with:
          path: .price-cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Check the Yahoo download library (else go back to the last version that worked)
        run: |
          mkdir -p .price-cache
          now=$(pip show yfinance | awk '/^Version/{print $2}')
          ok=$(cat .price-cache/yfinance-ok 2>/dev/null || true)
          if v=$(python scripts/check_yahoo.py); then
            echo "$v" > .price-cache/yfinance-ok
          elif [ -n "$ok" ] && [ "$ok" != "$now" ]; then
            echo "yfinance $now can't download: going back to $ok, the last version that worked here"
            pip install -q "yfinance==$ok" && python scripts/check_yahoo.py \
              || echo "::warning::Yahoo downloads still fail: tonight's prices come from the backups"
          else
            echo "::warning::Yahoo downloads fail: tonight's prices come from the backups"
          fi

      - name: Rank the S&P 500 and replay the rule
        # also logs tonight's decision to the default plan's paper record (data/paper_ledger.json, mtl/paper.py)
        # and every data problem to the issues log (data/issues_log.json, mtl/health.py)
        id: scan
        timeout-minutes: 45
        env:
          PAPER_LEDGER_WRITE: '1'
          PRICE_CACHE: .price-cache/prices.json.gz
          TIINGO_KEY: ${{ secrets.TIINGO_KEY }}
        run: python scripts/momentum_scan.py

      - name: Save the price copy for the next run
        if: ${{ steps.scan.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .price-cache
          key: prices-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Scan all US stocks for ignition setups (Next big thing watch)
        # A bad day for this ~5,000-ticker scan must never block the main dashboard;
        # the page then shows the previous scan, and the next step logs the failure.
        id: ignition
        continue-on-error: true
        timeout-minutes: 45
        env:
          TIINGO_KEY: ${{ secrets.TIINGO_KEY }}
        run: python scripts/ignition_scan.py

      - name: Log a failed ignition scan
        if: ${{ steps.ignition.outcome == 'failure' }}
        run: python scripts/log_issue.py ignition "Tonight's Next big thing scan failed, so the page shows the previous one (it never affects the plan)."

      - name: Update the market events page
        # new big-move, Fed, VIX and market-phase events and SPY's moves (docs/events.html, information only);
        # headlines from the free feeds and the Fed's statements are saved too; a failure never blocks the
        # dashboard and is logged to the issues list
        id: events
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/major_events.py

      - name: Log a failed events update
        if: ${{ steps.events.outcome == 'failure' }}
        run: |
          python scripts/log_issue.py events "Tonight's market events update failed, so the events page wasn't updated (it never affects the plan)."

      - name: Read the dominoes
        # which of the eight dominoes are down, how deep past falls went by that count, and the closest past times
        # with what followed (data/dominoes.json, information only); a failure never blocks the dashboard
        id: dominoes
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/dominoes.py

      - name: Log a failed dominoes update
        if: ${{ steps.dominoes.outcome == 'failure' }}
        run: |
          python scripts/log_issue.py dominoes "Tonight's dominoes update failed, so the dominoes card shows the last good reading (it never affects the plan)."

      - name: Refresh what followed speculator crowding (weekly)
        # the crowding gauge's history table (data/crowding_history.json, information only); a failure never blocks
        # the dashboard and keeps last week's figures
        id: crowdhist
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/crowding_history.py

      - name: Log a failed crowding-history refresh
        if: ${{ steps.crowdhist.outcome == 'failure' }}
        run: |
          python scripts/log_issue.py crowding "This week's crowding-history refresh failed, so the crowding gauge shows last week's what-followed figures (it never affects the plan)."

      - name: News forward test (write tonight's calls, score past ones)
        # fixed guesses about what follows each day's news, written before the next open and scored afterwards
        # (data/news_forward.json, information only); a failure never blocks the dashboard
        id: newsfwd
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/news_forward.py

      - name: Log a failed news forward test
        if: ${{ steps.newsfwd.outcome == 'failure' }}
        run: |
          python scripts/log_issue.py newsfwd "Tonight's news forward test step failed, so its calls for today may be missing (information only; the plan is unaffected)."

      - name: Render the dashboard
        # after the events step, so a news feed problem it logs shows on tonight's page
        run: python scripts/render_scanner.py

      - name: Commit and push the dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scanner.html docs/events.html docs/issues.html docs/stress.html docs/forward.html data/dominoes.json data/crowding_history.json data/news_forward.json data/major_events.json data/event_patterns.json data/event_forecasts.json data/headlines_log.json data/paper_ledger.json data/issues_log.json data/ignition_scan.json data/listed.csv data/ignition_industries.json data/industries_all.csv data/theme_history.json data/watchlist.json data/revisions_log.json data/sp500.csv data/sp500.asof data/ndx100.csv data/ndx100.asof
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Top 5 Strongest dashboard refresh"
          # The daily-fetch workflow pushes to main too; replay on top.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Friday alert - open an issue when Monday's trade has anything to do
        # runs even if the push failed: the alert matters more than the page
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python scripts/weekly_alert.py "$RUNNER_TEMP" "$OWNER"
          if [ ! -f "$RUNNER_TEMP/alert_title.txt" ]; then
            echo "no alert this time"
            exit 0
          fi
          title=$(cat "$RUNNER_TEMP/alert_title.txt")
          # the same title sent in the last 30 days (open or closed) is a re-run, not a new alert
          since=$(date -u -d '30 days ago' +%Y-%m-%d)
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --author "app/github-actions" --search "\"$title\" in:title created:>=$since" --json title \
               --jq ".[] | select(.title == $(printf '%s' "$title" | jq -Rs .)) | .title" | grep -q .; then
            echo "already sent: $title"
            exit 0
          fi
          # a trade alert supersedes the open ones; a downtrend warning (info only) leaves them open
          case "$title" in Trade*)
            for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author "app/github-actions" --search "Trade in:title" --json number,title --jq '.[] | select(.title | startswith("Trade ")) | .number'); do
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Superseded by this week's alert."
            done;;
          esac
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/alert_body.md"

      - name: Ignition alert - open an issue when tonight's scan flags an Ignition or Turnaround
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          D="$RUNNER_TEMP/ignition"; mkdir -p "$D"   # its own folder: the Friday alert's files are in $RUNNER_TEMP
          python scripts/ignition_alert.py "$D" "$OWNER"
          if [ ! -f "$D/alert_title.txt" ]; then
            echo "no ignition alert"
            exit 0
          fi
          title=$(cat "$D/alert_title.txt")
          since=$(date -u -d '30 days ago' +%Y-%m-%d)
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --author "app/github-actions" --search "\"$title\" in:title created:>=$since" --json title \
               --jq ".[] | select(.title == $(printf '%s' "$title" | jq -Rs .)) | .title" | grep -q .; then
            echo "already sent: $title"
            exit 0
          fi
          # keep only the latest ignition alert open
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author "app/github-actions" --search "alert in:title" --json number,title --jq '.[] | select(.title | startswith("Ignition") or startswith("Theme alert") or startswith("Watchlist alert")) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Superseded by a newer ignition alert."
          done
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$D/alert_body.md"

      - name: Tell the outside alarm how tonight went (healthchecks.io)
        # GitHub can't report a run that never starts, so an outside service expects this ping every weeknight and
        # emails when it doesn't come (the HEALTHCHECK_URL secret; skipped without it)
        if: ${{ always() }}
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          [ -n "$HC_URL" ] || { echo "no HEALTHCHECK_URL secret: skipped"; exit 0; }
          if [ "${{ job.status }}" = "success" ]; then u="$HC_URL"; else u="$HC_URL/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$u" || echo "::warning::could not reach healthchecks.io"

      - name: Open an issue if this run failed
        # any failed, timed-out or cancelled step above (the ignition scan's own failures are logged above):
        # tonight's decision, page or alert may be missing. Also added to the page's issues list.
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          bash scripts/report_failure.sh "Scanner run failed $(TZ=America/New_York date +%Y-%m-%d)" \
            "The nightly scanner run failed or timed out, so that night's decision, dashboard or trade alert may be missing. Check the run log before trading." run
