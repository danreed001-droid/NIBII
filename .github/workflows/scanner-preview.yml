name: Scanner preview (branch)

# Builds docs/scanner.html on this branch only, to check a change before it
# goes to main. Never touches main.
on:
  push:
    branches: [monthly-plan]
    paths:
      - scripts/momentum_scan.py
      - scripts/render_scanner.py
      - .github/workflows/scanner-preview.yml
      - mtl/momentum.py
      - mtl/sleeve.py
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/momentum_scan.py --no-refresh
      - run: python scripts/render_scanner.py
      - name: Commit the preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scanner.html
          git commit -m "Scanner preview build" || exit 0
          git push
