name: Improvement test

# Runs scripts/robustness.py (lookahead test, point-in-time universe,
# start-date / outlier sensitivity, slippage and tax ledger) and commits
# data/improve.json on this branch. Never touches main.
on:
  push:
    branches: [robustness]
    paths:
      - scripts/improve.py
      - .github/workflows/improve.yml
      - mtl/momentum.py
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run the audit
        run: |
          set -o pipefail
          ONLY=ld,ldlin,ldt2x,lint2x python scripts/improve.py 2>&1 | tee data/improve.log
      - name: Commit the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/improve.log; if [ -f data/improve.json ]; then git add data/improve.json; fi; if [ -f data/improve_only.json ]; then git add data/improve_only.json; fi
          git commit -m "Improvement test results" || exit 0
          git push
