name: News event from issue form

# The report page's "Submit a news event" link opens the News event issue
# form (.github/ISSUE_TEMPLATE/news-event.yml). This turns a submission into
# a data/news_log.json entry, re-renders the page and closes the issue.
# Only the repository owner's submissions are accepted - the page is public,
# so anyone could open an issue, but nobody else's lands in the log.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: news-from-issue
  cancel-in-progress: false

jobs:
  add:
    if: >-
      contains(github.event.issue.body, '### Tickers') &&
      contains(github.event.issue.body, '### Direction') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Add the event to the news log
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set +e
          out=$(python scripts/add_news_from_issue.py)
          code=$?
          echo "$out"
          {
            echo "result<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit $code

      - name: Re-render the report page
        # Pure local computation - no market data needed.
        run: |
          LATEST=$(python scripts/latest_document_date.py)
          if [ -n "$LATEST" ]; then python scripts/render_html.py "$LATEST"; fi

      - name: Commit and push
        env:
          RESULT: ${{ steps.add.outputs.result }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_log.json docs/index.html documents/latest.html
          git commit -m "News log: manual entry $RESULT (#$ISSUE_NUMBER)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Confirm and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.add.outputs.result }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Added to the news log as \`$RESULT\` - the report page is re-rendered with it (GitHub Pages takes about a minute)."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report a rejected submission
        if: failure() && steps.add.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.add.outputs.result }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Not added: $RESULT. Edit and resubmit as a new issue."
