name: Track record refresh

# Reruns the point-in-time backtest (research/backtest/refresh.sh) and rebuilds
# data/track_record.json, the growth chart and year table on the Top 5 Strongest
# dashboard, then renders docs/scanner.html with it. It also rebuilds
# data/plan_history.json (where the plan was each day) and redraws docs/events.html. Runs every 3 months and from
# the "Refresh now" button at the bottom of the dashboard (Run workflow).
# It stops without publishing when the default plan's return a year moves more
# than 3 points or its worst drop more than 5 (research/backtest/compare_track.py);
# run it with "Publish even if the numbers moved a lot" ticked to publish anyway.

on:
  schedule:
    # 13:47 UTC on Jan 5, Apr 5, Jul 5 and Oct 5
    - cron: '47 13 5 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the numbers moved a lot'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: track-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0   # the engine is a commit on the robustness branch

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      - name: Keep the engine's base commit tagged
        # refresh.sh builds on the commit BASE; the backtest-engine-base tag keeps it reachable on GitHub
        run: |
          BASE=$(sed -n 's/^BASE=//p' research/backtest/refresh.sh)
          if git ls-remote --exit-code --tags origin refs/tags/backtest-engine-base >/dev/null; then
            echo "tag backtest-engine-base is there"
          else
            git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch -q origin robustness
            git tag backtest-engine-base "$BASE"
            git push origin refs/tags/backtest-engine-base
          fi

      - name: Backtest engine in step with the live rules
        # a live rule changed since the overlay engine was last synced: the run goes on, and an issue says so
        id: sync
        continue-on-error: true
        run: python research/backtest/check_sync.py

      - name: Rerun the backtest
        # 2 worker processes fit the smaller runners private repos get (the results are the same)
        env:
          ENGINE_PROCS: '2'
        run: WORK="$RUNNER_TEMP/backtest" bash research/backtest/refresh.sh

      - name: Compare with the published numbers
        run: |
          git show HEAD:data/track_record.json > "$RUNNER_TEMP/published.json"
          python research/backtest/compare_track.py "$RUNNER_TEMP/published.json" data/track_record.json \
            || [ "${{ inputs.force }}" = "true" ]

      - name: Rank today's stocks and render the dashboard
        run: |
          python scripts/momentum_scan.py
          python scripts/render_scanner.py
          python scripts/major_events.py --render

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/track_record.json data/plan_history.json docs/scanner.html docs/issues.html docs/events.html
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Track record: backtest refresh"
          git stash -u -q || true
          # The dashboard and daily-fetch workflows push to main too; replay on top.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Open an issue if the refresh stopped
        # a failed step, or the published numbers would have moved more than the comparison allows
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          bash scripts/report_failure.sh "Track record refresh stopped $(date -u +%Y-%m-%d)" \
            "The track record refresh stopped without publishing: a step failed or timed out, or the default plan's numbers moved more than 3 points a year (or its worst drop more than 5). The log says which; to publish moved numbers anyway, run it again with \"Publish even if the numbers moved a lot\" ticked." track

      - name: Open an issue if the engine is behind the live rules
        if: ${{ !cancelled() && steps.sync.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          bash scripts/report_failure.sh "Backtest engine behind the live rules $(date -u +%Y-%m-%d)" \
            "A live rule changed since the backtest engine (research/backtest/overlay) was last synced, so the refreshed track record may not be the live plan's. Sync the engine's NBup variant, then run research/backtest/check_sync.py --update." track
